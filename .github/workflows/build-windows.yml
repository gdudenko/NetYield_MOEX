name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity check checkout
        shell: pwsh
        run: |
          $required = @(
            'app_config.py','logger.py','error_handler.py',
            'main.py','run_gui.py','smoke_test.py',
            'app_icon.ico','app_icon.png',
            'services','analysis','ui'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "В РЕПОЗИТОРИИ ОТСУТСТВУЕТ: $f" }
          }
          Write-Host "All project files present in checkout"

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name NetYield_MOEX
          --icon=app_icon.ico
          --add-data "app_icon.ico;."
          --add-data "app_icon.png;."
          --paths=.
          --hidden-import=app_config
          --collect-data customtkinter
          --collect-data tkcalendar
          run_gui.py

      - name: Build and run frozen smoke test
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --console
          --name smoke_test --paths=. --hidden-import=app_config smoke_test.py
          $env:PYTHONIOENCODING = "utf-8"
          .\dist\smoke_test\smoke_test.exe

      - name: Archive build
        run: >
          Compress-Archive -Path dist/NetYield_MOEX
          -DestinationPath NetYield_MOEX-windows.zip

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NetYield_MOEX-windows.zip
          generate_release_notes: true

      - name: Upload artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: NetYield_MOEX-windows
          path: dist/NetYield_MOEX

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-diagnostics
          path: |
            build/smoke_test/warn-smoke_test.txt
            build/NetYield_MOEX/warn-NetYield_MOEX.txt
