name: Build Windows EXE

on:
  push:
    tags: ["v*"] # Сборка и публикация по тегу версии
  workflow_dispatch: # Ручной запуск (артефакт без Release)

permissions:
  contents: write # Нужно для создания Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name NetYield_MOEX
          --collect-data customtkinter
          --collect-data tkcalendar
          run_gui.py

      - name: Archive build
        run: >
          Compress-Archive -Path dist/NetYield_MOEX
          -DestinationPath NetYield_MOEX-windows.zip

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NetYield_MOEX-windows.zip
          generate_release_notes: true

      - name: Upload artifact (для ручного запуска)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NetYield_MOEX-windows
          path: dist/NetYield_MOEX
